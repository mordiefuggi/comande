<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2321">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Comande</title>
<style>
:root{
  --bg:#DCE0DD; --surface:#F4F5F3; --side:#C9CFCB; --ink:#1C2321; --muted:#56605C; --line:#BCC3BF;
  --paper:#FFFFFB; --thermal:#232323; --danger:#A3321F;
  --cond:"Roboto Condensed","sans-serif-condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --sans:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.4}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.app{display:grid;grid-template-columns:1fr minmax(330px,390px);height:100vh;height:100dvh}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 0}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:12px 18px 16px;font-family:var(--cond);font-weight:700;font-size:21px;border-radius:12px 12px 0 0;color:var(--muted);position:relative;white-space:nowrap}
.tab::after{content:"";position:absolute;left:14px;right:14px;bottom:7px;height:4px;border-radius:2px;background:var(--cat)}
.tab[aria-selected="true"]{background:var(--cat);color:#fff}
.tab[aria-selected="true"]::after{display:none}
.searchbox{flex:1;display:flex;gap:8px;align-items:center;padding-bottom:10px}
.tools{display:flex;gap:6px;padding-bottom:8px;flex-wrap:wrap;justify-content:flex-end}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px;white-space:nowrap}
.tool.alert{border-color:#D9B25F;background:#F6E7C8}
.grid-wrap{flex:1;overflow:auto;padding:14px 12px;border-top:5px solid var(--cat)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.prod{display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:106px;padding:12px 12px 12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden;transition:transform .08s}
.prod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--cat)}
.prod:active{transform:scale(.97)}
.prod-name{font-family:var(--cond);font-weight:700;font-size:22px;line-height:1.1}
.prod-price{font-size:15px;color:var(--muted);margin-top:10px}
.prod.gone{opacity:.5;background:repeating-linear-gradient(135deg,#EDEFEC,#EDEFEC 8px,#E3E6E3 8px,#E3E6E3 16px)}
.prod.gone .prod-price{color:var(--danger);font-weight:700}
.prod.flash{animation:flash .45s ease-out}
@keyframes flash{0%{background:var(--cat);color:#fff}100%{background:var(--surface)}}
.blank{max-width:480px;margin:24px auto;text-align:center;color:var(--muted)}
.blank h2{font-family:var(--cond);font-size:28px;color:var(--ink);margin:0 0 8px}
.blank p{line-height:1.5}

.side{background:var(--side);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.side-head{display:none;justify-content:space-between;align-items:center}
.side-head strong{font-family:var(--cond);font-size:24px}
.order-meta{display:flex;gap:8px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:10px 12px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.name-input,.field{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;min-width:0;width:100%}
textarea.field{min-height:150px;font-family:var(--mono);font-size:14px}
.name-input{flex:1}
.paper{flex:1;min-height:0;background:var(--paper);color:var(--thermal);font-family:var(--mono);font-size:14px;display:flex;flex-direction:column}
.tear{height:9px;flex:none;margin-top:-10px;background:conic-gradient(from -45deg at 50% 100%,var(--paper) 90deg,transparent 90deg) 0 0/14px 9px repeat-x}
.paper-head{text-align:center;padding:14px 12px 10px;border-bottom:1px dashed #999}
.paper-shop{font-weight:700;font-size:15px}
.paper-no{font-size:22px;font-weight:700;margin-top:4px}
.lines{flex:1;overflow:auto}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;padding:10px 12px;border-bottom:1px dotted #cfcfcf;align-items:start}
.line-qty{display:flex;align-items:center}
.qbtn{width:34px;height:34px;border:1px solid #bbb;background:#fff;border-radius:8px;font-family:var(--sans);font-size:19px;line-height:1}
.qn{min-width:24px;text-align:center;font-weight:700}
.line-main{background:none;border:0;text-align:left;padding:6px 0 0;font-family:var(--mono);font-size:14px;color:inherit}
.line-name{display:block;font-weight:700}
.line-sub{display:block;color:#555;font-size:13px;margin-top:2px}
.line-price{font-weight:700;white-space:nowrap;padding-top:6px}
.empty{padding:28px 16px;color:#6b6b6b;text-align:center;font-family:var(--sans)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px;border-top:1px dashed #999;font-weight:700;font-size:24px}
.actions{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-weight:600;font-size:16px}
.btn-print{background:var(--ink);color:#fff;border-color:var(--ink);font-family:var(--cond);font-size:24px;font-weight:700;padding:14px}
.btn-danger{color:var(--danger)}
.sheet-bar{display:none}

.modal-back{position:fixed;inset:0;background:rgba(28,35,33,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:16px;width:min(740px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden;border-top:8px solid var(--cat)}
.modal-wide{width:min(1000px,100%)}
.modal-small{width:min(430px,100%)}
.modal-admin{height:calc(100dvh - 32px)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
.modal-title{font-family:var(--cond);font-weight:700;font-size:30px;margin:0;line-height:1.1}
.modal-body{overflow:auto;padding:0 18px 16px;flex:1}
.group{margin-top:14px}
.group h3,.h3{display:block;font-size:15px;color:var(--muted);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;font-size:17px;min-height:54px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left}
.chip small{font-weight:500;color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{background:var(--cat);border-color:var(--cat);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.chip.mini{min-height:44px;font-size:15px;padding:8px 12px}
.chip.mini[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.chip.tag[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.modal-foot{display:flex;gap:10px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:#E7EAE8}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;flex:none}
.stepper button{width:48px;height:52px;border:0;background:none;font-size:24px}
.stepper span{min-width:30px;text-align:center;font-weight:700;font-size:19px}
.btn-add{flex:1;background:var(--cat);color:#fff;border:0;border-radius:12px;min-height:54px;padding:0 16px;font-family:var(--cond);font-weight:700;font-size:23px}
.hint{color:var(--muted);font-size:14px;line-height:1.5}
.warn{background:#F6E7C8;border:1px solid #D9B25F;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}

.slips{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;padding-top:6px}
.slip-wrap{margin:0;max-width:100%;overflow-x:auto}
.slip-wrap figcaption{font-size:14px;color:var(--muted);margin-bottom:6px}
.slip{--w:32;width:calc(var(--w) * 1ch + 28px);padding:16px 14px 10px;background:var(--paper);color:var(--thermal);font-family:var(--mono);font-size:13px}
.slip .tear{margin-top:0}
.r{white-space:pre;line-height:1.4;min-height:1.4em}
.a-c{text-align:center}.a-r{text-align:right}.b{font-weight:700}
.s-big{font-size:2em;line-height:1.25}
.s-tall{transform:scaleY(1.75);transform-origin:top;margin-bottom:1.05em}

.atabs{display:flex;gap:6px;padding:0 18px 12px;overflow-x:auto;flex:none}
.atab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}
.atab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.acat{margin:8px 0 26px;padding-left:12px;border-left:6px solid var(--cat)}
.acat-title{font-family:var(--cond);font-size:26px;margin:0 0 10px}
.aprod,.agroup,.acatrow,.aing{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:grid;gap:8px}
.aprod.is-hidden{opacity:.55}
.arow{display:flex;gap:8px;align-items:center}
.field.price{flex:0 0 100px;width:100px;text-align:right}
.field.mini{flex:0 0 120px;width:120px;text-align:right}
.avars{display:grid;gap:8px;padding-left:12px;border-left:3px solid var(--line)}
.achecks{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px}
.achecks label,.check{display:flex;align-items:center;gap:8px;min-height:38px}
.achecks input,.check input{width:20px;height:20px;accent-color:var(--ink)}
.link{background:none;border:0;padding:6px 0;text-decoration:underline;text-underline-offset:3px;font-weight:600;text-align:left}
.link.danger{color:var(--danger)}
.links{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:8px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.aform{max-width:560px}
.aform .h3{margin-top:18px}
.stats{display:flex;gap:12px;margin:4px 0 16px}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--muted)}
.stat-n{display:block;font-family:var(--cond);font-weight:700;font-size:36px;color:var(--ink)}
.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);margin-bottom:16px}
.table td,.table th{padding:10px 12px;border-bottom:1px solid #e1e5e3;text-align:left;font-weight:400}
.table th{font-weight:600;color:var(--muted);font-size:14px}
.table td:last-child,.table th:last-child{text-align:right;font-weight:700}
.handle{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:18px;line-height:1;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center}
.dragging{opacity:.65;box-shadow:0 8px 20px rgba(0,0,0,.25)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;transition:opacity .2s,transform .2s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .tab{font-size:19px;padding:10px 14px 15px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .grid-wrap{padding-bottom:96px}
  .side{position:fixed;left:0;right:0;bottom:0;height:90dvh;transform:translateY(105%);transition:transform .25s;z-index:30;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .side.open{transform:none}
  .side-head{display:flex}
  .sheet-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:15px 18px;font-size:17px;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .sheet-bar strong{font-family:var(--cond);font-size:23px}
  .modal-back{padding:0;align-items:flex-end}
  .modal,.modal-admin{border-radius:16px 16px 0 0;max-height:94dvh}
  .modal-admin{height:94dvh}
  .toast{bottom:96px}
  .seg button{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <main class="main" id="main">
    <div class="topbar" id="topbar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="searchbox" id="searchbox" hidden><input class="field" id="search" placeholder="Cerca un prodotto" autocomplete="off" aria-label="Cerca un prodotto"><button class="tool" data-act="search-off">Chiudi</button></div>
      <div class="tools" id="tools">
        <button class="tool" data-act="search-on">Cerca</button>
        <button class="tool" data-act="out" id="outBtn">Esauriti</button>
        <button class="tool" data-act="reprint" id="reprintBtn">Ristampa</button>
        <button class="tool" data-act="admin">Gestione</button>
      </div>
    </div>
    <div class="grid-wrap" id="gridWrap"><div class="grid" id="grid"></div></div>
  </main>

  <aside class="side" id="side" aria-label="Comanda">
    <div class="side-head"><strong>Comanda</strong><button class="tool" data-act="sheet-close">Chiudi</button></div>
    <div class="order-meta">
      <div class="seg" role="group" aria-label="Tipo di ordine" id="typeSeg"></div>
      <input class="name-input" id="customer" placeholder="Nome cliente" autocomplete="off" aria-label="Nome cliente">
    </div>
    <div class="paper">
      <div class="paper-head"><div class="paper-shop" id="shopName"></div><div class="paper-no" id="orderNo"></div></div>
      <div class="lines" id="lines"></div>
      <div class="total"><span>Totale</span><span id="total"></span></div>
    </div>
    <div class="tear"></div>
    <div class="actions">
      <button class="btn" data-act="clear" id="clearBtn">Svuota</button>
      <button class="btn btn-print" data-act="print" id="printBtn">Stampa comanda</button>
    </div>
  </aside>
</div>
<button class="sheet-bar" data-act="sheet-open" id="sheetBar"></button>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

const PALETTE = ['#C3850F', '#B93D27', '#4A7F33', '#29649B', '#7B4BA6', '#B1633A', '#2F7D74', '#8A6F1E'];
const STORE_KEY = 'comande.v1';
const RAWBT_PKG = 'ru.a402d.rawbtprinter';

function blankData() {
  return {
    settings: { shopName: '', width: 32, kitchenCopy: true, preview: true, pin: '1234',
      codepage: 'ascii', sendMode: 'intent', dailyReset: true, showCost: false, baseLabel: 'Tipo',
      bases: [{ id: 'base1', n: 'Panino' }, { id: 'base2', n: 'Tortilla' }] },
    categories: [
      { id: 'panini', name: 'Panini e tortillas', color: PALETTE[0], kitchen: true, base: true },
      { id: 'vaschette', name: 'Vaschette', color: PALETTE[2], kitchen: true, base: false },
      { id: 'bibite', name: 'Bibite', color: PALETTE[3], kitchen: false, base: false }
    ],
    groups: [
      { id: 'salse', name: 'Salse', style: 'named', priced: false, options: [] },
      { id: 'aggiunte', name: 'Aggiunte', style: 'plus', priced: true, options: [] },
      { id: 'senza', name: 'Senza', style: 'plain', priced: false, options: [] }
    ],
    ingredients: [],
    products: []
  };
}

let S = blankData();
let active = 'panini', cart = [], orderNo = 1, orderType = 'asporto', customer = '', search = '';
let stats = { date: '', orders: 0, revenue: 0, items: {} };
let daily = { date: '', out: {}, outP: {} };
let history = [];
let last = null, modal = null, adminTab = 'prodotti', uidN = 100, focusSel = null, storageOk = true;

/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round = n => Math.round(n * 100) / 100;
const money = n => round(n).toFixed(2).replace('.', ',');
const parseMoney = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : round(n); };
const uid = p => p + Date.now().toString(36) + (++uidN);
const prod = id => S.products.find(p => p.id === id);
const cat = id => S.categories.find(c => c.id === id) || S.categories[0];
const grp = id => S.groups.find(g => g.id === id);
const ingr = id => S.ingredients.find(i => i.id === id);
const hasVariants = p => Array.isArray(p.variants) && p.variants.length > 0;
const usesBase = p => !!p.useBase && S.settings.bases.length > 0;
const isNarrow = () => matchMedia('(max-width:820px)').matches;
const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const itDate = s => s.split('-').reverse().join('/');
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

function fmtDate(d) {
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
function armed(btn, label) {
  if (btn.dataset.armed) { clearTimeout(btn._t); delete btn.dataset.armed; btn.textContent = btn.dataset.label; return true; }
  btn.dataset.armed = '1'; btn.dataset.label = btn.textContent; btn.textContent = label;
  btn._t = setTimeout(() => { delete btn.dataset.armed; btn.textContent = btn.dataset.label; }, 2500);
  return false;
}

/* ---------- esauriti di giornata ---------- */
const ingOut = id => !!daily.out[id];
const prodOut = p => !!daily.outP[p.id] || (p.ing || []).some(ingOut);
const optOut = o => (o.ing || []).some(ingOut);
const outCount = () => Object.values(daily.out).filter(Boolean).length + Object.values(daily.outP).filter(Boolean).length;

/* ---------- salvataggio ---------- */
function snapshot() { return { v: 2, S, orderNo, stats, daily, history }; }
function doSave() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(snapshot())); storageOk = true; }
  catch (e) { storageOk = false; }
}
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(doSave, 300); }

function migrate(raw) {
  const base = blankData(), d = Object.assign({}, raw.S || {});
  const out = Object.assign(base, d);
  out.settings = Object.assign(blankData().settings, d.settings || {});
  if (!Array.isArray(out.settings.bases) || !out.settings.bases.length) out.settings.bases = blankData().settings.bases;
  out.ingredients = Array.isArray(d.ingredients) ? d.ingredients : [];
  out.categories = Array.isArray(d.categories) && d.categories.length ? d.categories : blankData().categories;
  out.groups = Array.isArray(d.groups) && d.groups.length ? d.groups : blankData().groups;
  out.products = Array.isArray(d.products) ? d.products : [];

  // Panini e Tortillas diventano una categoria sola con la scelta del tipo
  const hasT = out.categories.some(c => c.id === 'tortillas'), hasP = out.categories.some(c => c.id === 'panini');
  if (hasT && hasP) {
    out.products.forEach(p => { if (p.cat === 'tortillas') p.cat = 'panini'; });
    out.categories = out.categories.filter(c => c.id !== 'tortillas');
    const pc = out.categories.find(c => c.id === 'panini');
    pc.name = 'Panini e tortillas'; pc.base = true;
  }
  out.categories.forEach(c => { if (typeof c.base !== 'boolean') c.base = (c.id === 'panini'); });
  out.products.forEach(p => {
    const pc = out.categories.find(c => c.id === p.cat) || out.categories[0];
    if (p.useBase === undefined) p.useBase = !!(pc && pc.base);
    p.mods = p.mods || []; p.ing = p.ing || []; p.baseExtra = p.baseExtra || {};
    if (typeof p.cost !== 'number') p.cost = 0;
    if (Array.isArray(p.variants) && p.variants.length === 1) { p.price = p.variants[0].p; delete p.variants; delete p.variantsLabel; }
    if (Array.isArray(p.variants)) p.variants.forEach(v => { if (typeof v.cost !== 'number') v.cost = 0; });
  });
  const senza = out.groups.find(g => g.id === 'senza');
  if (senza) { senza.priced = false; senza.options.forEach(o => { o.p = 0; }); }
  out.groups.forEach(g => g.options.forEach(o => { o.ing = o.ing || []; }));
  return out;
}
function loadStore() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { storageOk = false; return; }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (d && d.S) {
      S = migrate(d);
      orderNo = d.orderNo || 1;
      stats = d.stats || stats;
      daily = d.daily || daily;

}
function rollDay() {
  const t = today();
  if (daily.date !== t) daily = { date: t, out: {}, outP: {} };
  if (!stats.date) { stats.date = t; return; }
  if (stats.date === t) return;
  if (stats.orders) history.unshift({ date: stats.date, orders: stats.orders, revenue: stats.revenue });
  history = history.slice(0, 60);
  stats = { date: t, orders: 0, revenue: 0, items: {} };

/* ---------- righe della comanda ---------- */
function optById(id) { for (const g of S.groups) { const o = g.options.find(x => x.id === id); if (o) return { g, o }; } return null; }
function baseOf(l) { return S.settings.bases.find(b => b.id === l.b) || null; }
function unitPrice(l) {
  const p = prod(l.pid); if (!p) return 0;
  let u = hasVariants(p) ? (p.variants[l.v] ? p.variants[l.v].p : p.variants[0].p) : p.price;
  if (usesBase(p) && l.b) u += Number(p.baseExtra[l.b] || 0);
  l.mods.forEach(id => { const r = optById(id); if (r && r.g.priced) u += r.o.p; });
  return round(u);
}
function lineDetails(l) {
  const p = prod(l.pid), out = [];
  if (!p) return out;
  const b = baseOf(l); if (usesBase(p) && b) out.push(b.n);
  if (hasVariants(p) && p.variants[l.v]) out.push(p.variants[l.v].n);
  S.groups.forEach(g => {
    const names = g.options.filter(o => l.mods.includes(o.id)).map(o => o.n);
    if (!names.length) return;
    const txt = names.join(', ');
    out.push(g.style === 'plus' ? '+ ' + txt : g.style === 'plain' ? txt : g.name + ': ' + txt);
  });
  if (l.note) out.push('Nota: ' + l.note);
  return out;
}
const cartTotal = () => round(cart.reduce((s, l) => s + unitPrice(l) * l.qty, 0));
const cartCount = () => cart.reduce((s, l) => s + l.qty, 0);
const keyOf = l => [l.pid, l.b, l.v, [...l.mods].sort().join('+'), l.note].join('|');
function addLine(d) {
  const ex = cart.find(l => keyOf(l) === keyOf(d));
  if (ex) ex.qty += d.qty; else cart.push({ uid: uid('l'), ...d });
}

/* ---------- testo per il rotolo ---------- */
const MAP = { 'à': "a'", 'è': "e'", 'é': "e'", 'ì': "i'", 'ò': "o'", 'ù': "u'", 'À': "A'", 'È': "E'", 'É': "E'", 'Ì': "I'", 'Ò': "O'", 'Ù': "U'",
  '€': 'EUR', '’': "'", '‘': "'", '“': '"', '”': '"', '–': '-', '—': '-', '…': '...', '×': 'x' };
function A(s) {
  s = String(s);
  if (S.settings.codepage === 'cp1252') return s.replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-');
  return s.replace(/[àèéìòùÀÈÉÌÒÙ€’‘“”–—…×]/g, c => MAP[c]).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7E]/g, '?');
}
function wrap(text, w, fi = 0, ri = fi) {
  const out = []; let cur = ' '.repeat(fi), base = fi;
  for (let word of String(text).split(/\s+/).filter(Boolean)) {
    if (cur.length > base && cur.length + 1 + word.length > w) { out.push(cur); cur = ' '.repeat(ri); base = ri; }
    while (base + word.length > w) {
      const room = w - cur.length;
      cur += word.slice(0, room); word = word.slice(room);
      out.push(cur); cur = ' '.repeat(ri); base = ri;
    }
    cur += (cur.length > base ? ' ' : '') + word;
  }
  if (cur.trim()) out.push(cur);
  return out;
}
function lr(left, right, w) {
  const lines = wrap(left, w - right.length - 1, 0, 3);
  const lastL = lines.pop() || '';
  lines.push(lastL + ' '.repeat(Math.max(1, w - lastL.length - right.length)) + right);
  return lines;
}
function buildOrder() {
  return {
    no: orderNo, type: orderType, customer: customer.trim(), date: fmtDate(new Date()), total: cartTotal(),
    lines: cart.map(l => {
      const p = prod(l.pid), b = baseOf(l);
      return { name: p.name, qty: l.qty, unit: unitPrice(l), details: lineDetails(l), kitchen: cat(p.cat).kitchen,
        variant: [usesBase(p) && b ? b.n : null, hasVariants(p) && p.variants[l.v] ? p.variants[l.v].n : null].filter(Boolean).join(' ') || null };
    })
  };
}
function slipCassa(o) {
  const W = S.settings.width, R = [], add = (t, a = 'l', b = false, s = 'n') => R.push({ t, a, b, s });
  if (S.settings.shopName) wrap(A(S.settings.shopName), W).forEach(t => add(t, 'c', true));
  add('COMANDA N. ' + o.no, 'c', true, 'big');
  add(A(o.date + ' - ' + (o.type === 'qui' ? 'MANGIA QUI' : 'ASPORTO')), 'c');
  if (o.customer) wrap(A('Cliente: ' + o.customer), W).forEach(t => add(t, 'c', true));
  add('-'.repeat(W));
  o.lines.forEach(l => {
    lr(A(`${l.qty}x ${l.name}`), money(l.unit * l.qty), W).forEach(t => add(t, 'l', true));
    l.details.forEach(d => wrap(A(d), W, 3, 5).forEach(t => add(t)));
  });
  add('-'.repeat(W));
  lr('TOTALE', money(o.total) + (S.settings.codepage === 'cp1252' ? ' €' : ' EUR'), W).forEach(t => add(t, 'l', true, 'tall'));
  add('-'.repeat(W));
  add('Documento non fiscale', 'c');
  return R;
}
function slipCucina(o) {
  const W = S.settings.width, R = [], add = (t, a = 'l', b = false, s = 'n') => R.push({ t, a, b, s });
  add('CUCINA  N. ' + o.no, 'c', true, 'big');
  add(A(o.date.slice(-5) + ' - ' + (o.type === 'qui' ? 'MANGIA QUI' : 'ASPORTO')), 'c', true);
  if (o.customer) wrap(A(o.customer), W).forEach(t => add(t, 'c', true));
  add('='.repeat(W));
  o.lines.filter(l => l.kitchen).forEach((l, i) => {
    if (i) add('-'.repeat(W));
    wrap(A(`${l.qty}x ${l.name}`), W, 0, 3).forEach(t => add(t, 'l', true, 'tall'));
    l.details.forEach(d => wrap(A(d), W, 3, 5).forEach(t => add(t, 'l', false, 'tall')));
  });
  add('='.repeat(W));
  return R;
}

  if (S.settings.shopName) R.push({ t: A(S.settings.shopName), a: 'c', b: true, s: 'n' });

/* ---------- ESC/POS + RawBT ---------- */
function charByte(ch) {
  const code = ch.codePointAt(0);
  if (code < 0x80) return code;
  if (S.settings.codepage === 'cp1252') { if (ch === '€') return 0x80; if (code <= 0xFF) return code; return 0x3F; }
  return 0x3F;
}
function encode(slipRows) {
  const out = [0x1B, 0x40];
  if (S.settings.codepage === 'cp1252') out.push(0x1B, 0x74, 16);
  slipRows.forEach(rows => {
    rows.forEach(r => {
      out.push(0x1B, 0x61, r.a === 'c' ? 1 : r.a === 'r' ? 2 : 0);
      out.push(0x1B, 0x45, r.b ? 1 : 0);
      out.push(0x1D, 0x21, r.s === 'big' ? 0x11 : r.s === 'tall' ? 0x01 : 0);
      for (const ch of r.t) out.push(charByte(ch));
      out.push(0x0A);
    });
    out.push(0x1B, 0x61, 0, 0x1B, 0x45, 0, 0x1D, 0x21, 0);
    out.push(0x1B, 0x64, 4);
    out.push(0x1D, 0x56, 0x01);
  });
  return Uint8Array.from(out);
}
function b64(bytes) { let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin); }
function send(bytes, msg) {
  if (!/Android/i.test(navigator.userAgent)) { toast('Anteprima: la stampa parte dal tablet Android con RawBT'); return; }
  const data = b64(bytes);
  const url = S.settings.sendMode === 'direct'
    ? 'rawbt:base64,' + data
    : 'intent:base64,' + data + '#Intent;scheme=rawbt;package=' + RAWBT_PKG + ';end;';
  try { window.location.href = url; toast(msg); }
  catch (e) { toast('RawBT non risponde: controlla che sia installato'); }
}
function doPrint(o, slips) {
  const bytes = encode(slips.map(s => s.rows));
  last = { bytes, no: o.no };
  send(bytes, 'Comanda n. ' + o.no + ' inviata alla stampante');
  rollDay();
  stats.orders++; stats.revenue = round(stats.revenue + o.total);
  o.lines.forEach(l => { const k = l.name + (l.variant ? ' (' + l.variant + ')' : ''); stats.items[k] = (stats.items[k] || 0) + l.qty; });
  orderNo++; cart = []; customer = ''; $('#customer').value = '';
  doSave();
  modal = null; renderModal();
  $('#side').classList.remove('open');
  renderTicket();
}

  const ps = hasVariants(p) ? p.variants.map(v => v.p) : [p.price];

function renderModal() {
  const root = $('#modalRoot');
  if (!modal) { root.innerHTML = ''; document.body.classList.remove('locked'); return; }
  const keepScroll = modal.kind === 'admin' && $('#adminBody') ? $('#adminBody').scrollTop : 0;
  document.body.classList.add('locked');
  root.innerHTML = modal.kind === 'item' ? itemHTML() : modal.kind === 'preview' ? previewHTML()
    : modal.kind === 'pin' ? pinHTML() : modal.kind === 'out' ? outHTML()
    : modal.kind === 'import' ? importHTML() : adminHTML();
  if (modal.kind === 'item') updateAddBtn();
  if (modal.kind === 'pin') $('#pin').focus();
  if (modal.kind === 'import') { const t = $('#imptxt'); t.value = modal.text || ''; t.focus(); }
  if (modal.kind === 'admin') {
    $('#adminBody').scrollTop = keepScroll;
    if (focusSel) {
      const el = $(focusSel);
      if (el) { el.focus(); if (typeof el.scrollIntoView === 'function') el.scrollIntoView({ block: 'center' }); }
      focusSel = null;
    }
  }
}
function closeModal() {
  const wasAdmin = modal && (modal.kind === 'admin' || modal.kind === 'out');
  modal = null; renderModal();
  if (wasAdmin) { doSave(); renderTabs(); renderGrid(); }
  renderTicket();
}
function download(name, text) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Backup salvato nei download');
  } catch (e) { toast('Backup non riuscito su questo browser'); }
}

/* ---------- riordino a trascinamento ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if (!h) return;
  const item = h.closest('[data-sid]'), list = item && item.closest('[data-sort]');
  if (!item || !list) return;
  drag = { item, list };
  item.classList.add('dragging');
  try { h.setPointerCapture(e.pointerId); } catch (err) { /* ignora */ }
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const y = e.clientY, body = $('#adminBody');
  if (body) {
    const r = body.getBoundingClientRect();
    if (y < r.top + 70) body.scrollTop -= 14;
    else if (y > r.bottom - 70) body.scrollTop += 14;
  }
  for (const el of [...drag.list.children]) {
    if (el === drag.item || !el.dataset.sid) continue;
    const r = el.getBoundingClientRect();
    if (y > r.top && y < r.bottom) {
      drag.list.insertBefore(drag.item, y < r.top + r.height / 2 ? el : el.nextSibling);
      break;
    }
  }
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  drag.item.classList.remove('dragging');
  const ids = [...drag.list.children].map(el => el.dataset.sid).filter(Boolean);
  const kind = drag.list.dataset.sort, key = drag.list.dataset.sortKey;
  if (kind === 'products') S.products = S.products.filter(p => p.cat !== key).concat(ids.map(prod).filter(Boolean));
  else if (kind === 'categories') S.categories = ids.map(id => S.categories.find(c => c.id === id)).filter(Boolean);
  else if (kind === 'options') { const g = grp(key); g.options = ids.map(id => g.options.find(o => o.id === id)).filter(Boolean); }
  else if (kind === 'bases') S.settings.bases = ids.map(id => S.settings.bases.find(b => b.id === id)).filter(Boolean);
  drag = null; doSave(); renderTabs(); renderGrid();
});

/* ---------- eventi ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  switch (el.dataset.act) {
    case 'mclose-back': if (e.target === el) closeModal(); break;
    case 'tab': active = el.dataset.id; search = ''; renderTabs(); renderGrid(); $('#gridWrap').scrollTop = 0; break;
    case 'search-on': $('#tabs').hidden = true; $('#tools').hidden = true; $('#searchbox').hidden = false; $('#search').focus(); break;
    case 'search-off': search = ''; $('#search').value = ''; $('#searchbox').hidden = true; $('#tabs').hidden = false; $('#tools').hidden = false; renderGrid(); break;
    case 'prod': {
      const p = prod(el.dataset.id); if (!p) break;
      if (prodOut(p)) { toast(p.name + ': segnato come esaurito'); break; }
      const hasOpts = usesBase(p) || hasVariants(p) || S.groups.some(g => (p.mods || []).includes(g.id) && g.options.some(o => !optOut(o)));
      if (hasOpts) { openItem(p.id); break; }
      addLine({ pid: p.id, b: null, v: null, mods: [], qty: 1, note: '' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      renderTicket();
      if (isNarrow()) toast('Aggiunto: ' + p.name);
      break;
    }
    case 'type': orderType = el.dataset.v; renderTicket(); break;
    case 'lq': {
      const l = cart.find(x => x.uid === el.dataset.uid); if (!l) break;
      l.qty += Number(el.dataset.d);
      if (l.qty <= 0) cart = cart.filter(x => x !== l);
      renderTicket(); break;
    }
    case 'editline': { const l = cart.find(x => x.uid === el.dataset.uid); if (l) openItem(l.pid, l.uid); break; }
    case 'clear': if (armed(el, 'Tocca di nuovo')) { cart = []; renderTicket(); } break;
    case 'print': {
      if (!cart.length) break;
      rollDay();
      const o = buildOrder(), slips = buildSlips(o);
      if (S.settings.preview) { modal = { kind: 'preview', o, slips }; renderModal(); } else doPrint(o, slips);
      break;
    }
    case 'pconfirm': doPrint(modal.o, modal.slips); break;
    case 'reprint': if (last) send(last.bytes, 'Ristampa comanda n. ' + last.no); break;
    case 'sheet-open': $('#side').classList.add('open'); break;
    case 'sheet-close': $('#side').classList.remove('open'); break;
    case 'out': rollDay(); modal = { kind: 'out' }; renderModal(); break;
    case 'toggle-ing': {
      const id = el.dataset.id;
      daily.out[id] = !daily.out[id];
      el.setAttribute('aria-pressed', String(!!daily.out[id]));
      doSave(); renderTabs(); renderGrid(); break;
    }
    case 'toggle-prod': {
      const id = el.dataset.id;
      daily.outP[id] = !daily.outP[id];
      el.setAttribute('aria-pressed', String(!!daily.outP[id]));
      doSave(); renderTabs(); renderGrid(); break;
    }
    case 'out-reset': daily.out = {}; daily.outP = {}; doSave(); renderModal(); renderTabs(); renderGrid(); toast('Tutto di nuovo disponibile'); break;
    case 'admin': modal = S.settings.pin ? { kind: 'pin' } : { kind: 'admin' }; renderModal(); break;
    case 'pinok':
      if ($('#pin').value.trim() === S.settings.pin) { modal = { kind: 'admin' }; renderModal(); }
      else { $('#pinMsg').textContent = 'PIN errato, riprova.'; $('#pin').value = ''; $('#pin').focus(); }
      break;
    case 'mclose': closeModal(); break;
    case 'mb':
      modal.b = el.dataset.id;
      el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === el)));
      updateAddBtn(); break;
    case 'mv':
      modal.v = Number(el.dataset.i);
      el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === el)));
      updateAddBtn(); break;
    case 'mm': {
      const id = el.dataset.id;
      if (modal.mods.has(id)) modal.mods.delete(id); else modal.mods.add(id);
      el.setAttribute('aria-pressed', String(modal.mods.has(id)));
      updateAddBtn(); break;
    }
    case 'mq': modal.qty = Math.max(1, modal.qty + Number(el.dataset.d)); updateAddBtn(); break;
    case 'madd': {
      const data = { pid: modal.pid, b: modal.b, v: modal.v, mods: [...modal.mods], qty: modal.qty, note: $('#mnote').value.trim() };
      const editing = modal.edit, name = prod(modal.pid).name;
      if (editing) Object.assign(cart.find(l => l.uid === editing), data); else addLine(data);
      closeModal();
      if (!editing && isNarrow()) toast('Aggiunto: ' + name);
      break;
    }
    case 'mdel': { const u = modal.edit; cart = cart.filter(l => l.uid !== u); closeModal(); break; }
    case 'atab': adminTab = el.dataset.t; modal = { kind: 'admin' }; renderModal(); $('#adminBody').scrollTop = 0; break;

    case 'padd': {
      const c = cat(el.dataset.cat), id = uid('p');
      S.products.push({ id, cat: c.id, name: '', price: 0, cost: 0, useBase: !!c.base, baseExtra: {}, ing: [], mods: S.groups.map(g => g.id) });
      focusSel = `[data-in="pname"][data-p="${id}"]`; save(); renderModal(); break;
    }
    case 'pdup': {
      const p = prod(el.dataset.p), copy = JSON.parse(JSON.stringify(p));
      copy.id = uid('p'); copy.name = p.name + ' (copia)';
      S.products.splice(S.products.indexOf(p) + 1, 0, copy);
      focusSel = `[data-in="pname"][data-p="${copy.id}"]`; save(); renderModal(); break;
    }
    case 'pdel': if (armed(el, 'Tocca di nuovo per eliminare')) {
      const id = el.dataset.p; S.products = S.products.filter(p => p.id !== id); cart = cart.filter(l => l.pid !== id);
      save(); renderModal();
    } break;
    case 'ptag': {
      const p = prod(el.dataset.p), i = el.dataset.i;
      p.ing = p.ing || [];
      if (p.ing.includes(i)) p.ing = p.ing.filter(x => x !== i); else p.ing.push(i);
      el.setAttribute('aria-pressed', String(p.ing.includes(i)));
      save(); break;
    }
    case 'pimport': modal = { kind: 'import', cat: el.dataset.cat, text: '', base: !!cat(el.dataset.cat).base, groups: S.groups.map(g => g.id) }; renderModal(); break;
    case 'impok': {
      const rows = parseImport(modal.text);
      if (!rows.length) { toast('Nessuna riga da importare'); break; }
      const c = cat(modal.cat), useBase = modal.base, groups = [...modal.groups];
      rows.forEach(r => S.products.push({ id: uid('p'), cat: c.id, name: r.name, price: r.price, cost: 0, useBase, baseExtra: {}, ing: [], mods: groups }));
      modal = { kind: 'admin' }; adminTab = 'prodotti'; doSave(); renderModal(); renderGrid();
      toast(rows.length + ' prodotti aggiunti');
      break;
    }
    case 'vadd': {
      const p = prod(el.dataset.p);
      if (!hasVariants(p)) { p.variants = [{ n: '', p: p.price, cost: p.cost || 0 }]; p.variantsLabel = p.variantsLabel || 'Scegli'; cart.forEach(l => { if (l.pid === p.id) l.v = 0; }); focusSel = `[data-in="vname"][data-p="${p.id}"][data-i="0"]`; }
      else { p.variants.push({ n: '', p: p.variants[p.variants.length - 1].p, cost: 0 }); focusSel = `[data-in="vname"][data-p="${p.id}"][data-i="${p.variants.length - 1}"]`; }
      save(); renderModal(); break;
    }
    case 'vsize': {
      const p = prod(el.dataset.p);
      p.variantsLabel = 'Formato';
      p.variants = [{ n: 'Piccola', p: p.price, cost: p.cost || 0 }, { n: 'Media', p: round(p.price * 1.4), cost: 0 }];
      cart.forEach(l => { if (l.pid === p.id) l.v = 0; });
      focusSel = `[data-in="vprice"][data-p="${p.id}"][data-i="0"]`;
      save(); renderModal(); break;
    }
    case 'vdel': {
      const p = prod(el.dataset.p), i = Number(el.dataset.i), removed = p.variants.splice(i, 1)[0];
      if (!p.variants.length) { p.price = removed.p; p.cost = removed.cost || 0; delete p.variants; delete p.variantsLabel; cart.forEach(l => { if (l.pid === p.id) l.v = null; }); }
      else cart.forEach(l => { if (l.pid === p.id) { if (l.v > i) l.v--; else if (l.v === i) l.v = 0; } });
      save(); renderModal(); break;
    }
    case 'gadd': { const id = uid('g'); S.groups.push({ id, name: '', style: 'named', priced: false, options: [] }); focusSel = `[data-in="gname"][data-g="${id}"]`; save(); renderModal(); break; }
    case 'gdel': if (armed(el, 'Tocca di nuovo per eliminare')) {
      const gid = el.dataset.g, ids = grp(gid).options.map(o => o.id);
      S.groups = S.groups.filter(x => x.id !== gid);
      S.products.forEach(p => { p.mods = (p.mods || []).filter(x => x !== gid); });
      cart.forEach(l => { l.mods = l.mods.filter(id => !ids.includes(id)); });
      save(); renderModal();
    } break;
    case 'obulk': {
      const g = grp(el.dataset.g);
      const input = document.querySelector(`[data-in="bulk"][data-g="${g.id}"]`);
      const names = input.value.split(',').map(s => s.trim()).filter(Boolean);
      if (!names.length) { toast('Scrivi le voci separate da virgola'); break; }
      names.forEach(n => g.options.push({ id: uid('o'), n, p: 0, ing: [] }));
      input.value = ''; save(); renderModal();
      toast(names.length + (names.length === 1 ? ' voce aggiunta' : ' voci aggiunte'));
      break;
    }
    case 'odel': {
      const g = grp(el.dataset.g), oid = el.dataset.o;
      g.options = g.options.filter(o => o.id !== oid);
      cart.forEach(l => { l.mods = l.mods.filter(id => id !== oid); });
      save(); renderModal(); break;
    }
    case 'iadd': { const id = uid('i'); S.ingredients.push({ id, n: '' }); focusSel = `[data-in="iname"][data-i="${id}"]`; save(); renderModal(); break; }
    case 'idel': {
      const id = el.dataset.i;
      S.ingredients = S.ingredients.filter(x => x.id !== id);
      S.products.forEach(p => { p.ing = (p.ing || []).filter(x => x !== id); });
      S.groups.forEach(g => g.options.forEach(o => { o.ing = (o.ing || []).filter(x => x !== id); }));
      delete daily.out[id];
      save(); renderModal(); break;
    }
    case 'iauto': {
      const i = ingr(el.dataset.i);
      if (!i || !i.n.trim()) { toast('Scrivi prima il nome dell\'ingrediente'); break; }
      const q = norm(i.n); let np = 0, no = 0;
      S.products.forEach(p => { if (norm(p.name).includes(q) && !(p.ing || []).includes(i.id)) { p.ing = (p.ing || []).concat(i.id); np++; } });
      S.groups.forEach(g => g.options.forEach(o => { if (norm(o.n).includes(q) && !(o.ing || []).includes(i.id)) { o.ing = (o.ing || []).concat(i.id); no++; } }));
      save(); renderModal();
      toast(np + ' prodotti e ' + no + ' voci collegati a ' + i.n);
      break;
    }
    case 'cadd': {
      const id = uid('c');
      S.categories.push({ id, name: '', color: PALETTE[S.categories.length % PALETTE.length], kitchen: true, base: false });
      focusSel = `[data-in="cname"][data-c="${id}"]`; save(); renderModal(); break;
    }
    case 'ccolor': { cat(el.dataset.c).color = decodeURIComponent(el.dataset.col); save(); renderModal(); break; }
    case 'cdel': {
      const id = el.dataset.c;
      if (S.categories.length <= 1) { toast('Serve almeno una categoria'); break; }
      if (S.products.some(p => p.cat === id)) { toast('Prima sposta o elimina i prodotti di questa categoria'); break; }
      if (armed(el, 'Tocca di nuovo per eliminare')) {
        S.categories = S.categories.filter(c => c.id !== id);
        if (active === id) active = S.categories[0].id;
        save(); renderModal();
      }
      break;
    }
    case 'badd': { const id = uid('base'); S.settings.bases.push({ id, n: '' }); focusSel = `[data-in="bname"][data-b="${id}"]`; save(); renderModal(); break; }
    case 'bdel': {
      const id = el.dataset.b;
      if (S.settings.bases.length <= 1) { toast('Serve almeno un tipo'); break; }
      S.settings.bases = S.settings.bases.filter(b => b.id !== id);
      S.products.forEach(p => { if (p.baseExtra) delete p.baseExtra[id]; });
      cart = cart.filter(l => l.b !== id);
      save(); renderModal(); break;
    }
    case 'sreset': if (armed(el, 'Tocca di nuovo per azzerare')) { stats = { date: today(), orders: 0, revenue: 0, items: {} }; doSave(); renderModal(); } break;
    case 'testprint': send(encode([testRows()]), 'Stampa di prova inviata'); break;
    case 'export': download('comande-backup-' + today() + '.json', JSON.stringify(snapshot(), null, 1)); break;
    case 'update':
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistration()
          .then(r => { if (r) { r.update(); toast('Cerco aggiornamenti: chiudi e riapri l\'app'); } else toast('Modalità offline non attiva qui'); })
          .catch(() => toast('Aggiornamento non riuscito'));
      } else toast('Questo browser non supporta la modalità offline');
      break;
    case 'wipe': if (armed(el, 'Tocca di nuovo per svuotare')) {
      S = blankData(); cart = []; active = S.categories[0].id;
      stats = { date: today(), orders: 0, revenue: 0, items: {} }; daily = { date: today(), out: {}, outP: {} };
      doSave(); renderModal(); toast('Menù svuotato');
    } break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'customer') { customer = t.value; return; }
  if (t.id === 'search') { search = t.value; renderGrid(); return; }
  const k = t.dataset.in; if (!k) return;
  const p = t.dataset.p ? prod(t.dataset.p) : null;
  const g = t.dataset.g ? grp(t.dataset.g) : null;
  const c = t.dataset.c ? cat(t.dataset.c) : null;
  switch (k) {
    case 'pname': p.name = t.value; break;
    case 'pprice': p.price = parseMoney(t.value); break;
    case 'pcost': p.cost = parseMoney(t.value); break;
    case 'pbextra': p.baseExtra[t.dataset.b] = parseMoney(t.value); break;
    case 'vlabel': p.variantsLabel = t.value; break;
    case 'vname': p.variants[Number(t.dataset.i)].n = t.value; break;
    case 'vprice': p.variants[Number(t.dataset.i)].p = parseMoney(t.value); break;
    case 'vcost': p.variants[Number(t.dataset.i)].cost = parseMoney(t.value); break;
    case 'gname': g.name = t.value; break;
    case 'oname': g.options.find(o => o.id === t.dataset.o).n = t.value; break;
    case 'oprice': g.options.find(o => o.id === t.dataset.o).p = parseMoney(t.value); break;
    case 'iname': ingr(t.dataset.i).n = t.value; break;
    case 'cname': c.name = t.value; break;
    case 'bname': { const b = S.settings.bases.find(x => x.id === t.dataset.b); if (b) b.n = t.value; break; }
    case 'sname': S.settings.shopName = t.value; break;
    case 'spin': S.settings.pin = t.value.trim(); break;
    case 'imptxt': {
      modal.text = t.value;
      const n = parseImport(modal.text).length;
      const btn = $('#impokBtn'), info = $('#impinfo');
      if (btn) btn.textContent = 'Aggiungi ' + (n || '');
      if (info) info.textContent = n ? n + ' righe riconosciute' : 'Incolla l\'elenco qui sopra.';
      return;
    }
    default: return;
  }
  save();
});

document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.in; if (!k) return;
  const p = t.dataset.p ? prod(t.dataset.p) : null;
  const g = t.dataset.g ? grp(t.dataset.g) : null;
  const c = t.dataset.c ? cat(t.dataset.c) : null;
  switch (k) {
    case 'pmod': {
      const gid = t.dataset.g; p.mods = p.mods || [];
      if (t.checked) { if (!p.mods.includes(gid)) p.mods.push(gid); } else p.mods = p.mods.filter(x => x !== gid);
      break;
    }
    case 'phidden': p.hidden = t.checked; t.closest('.aprod').classList.toggle('is-hidden', t.checked); break;
    case 'pbase': p.useBase = t.checked; if (!t.checked) cart.forEach(l => { if (l.pid === p.id) l.b = null; }); save(); renderModal(); return;
    case 'gpriced': g.priced = t.checked; if (!g.priced) g.options.forEach(o => { o.p = 0; }); save(); renderModal(); return;
    case 'ckitchen': c.kitchen = t.checked; break;
    case 'cbase': c.base = t.checked; break;
    case 'swidth': S.settings.width = Number(t.value); break;
    case 'scodepage': S.settings.codepage = t.value; break;
    case 'ssend': S.settings.sendMode = t.value; break;
    case 'skitchen': S.settings.kitchenCopy = t.checked; break;
    case 'spreview': S.settings.preview = t.checked; break;
    case 'sdaily': S.settings.dailyReset = t.checked; break;
    case 'scost': S.settings.showCost = t.checked; save(); renderModal(); return;
    case 'impbase': modal.base = t.checked; return;
    case 'impgrp': {
      const gid = t.dataset.g;
      modal.groups = t.checked ? modal.groups.concat([gid]) : modal.groups.filter(x => x !== gid);
      return;
    }
    case 'import': {
      const f = t.files && t.files[0]; if (!f) break;
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const d = JSON.parse(String(fr.result));
          if (!d || !d.S || !Array.isArray(d.S.products)) throw new Error('formato');
          S = migrate(d);
          if (d.stats) stats = d.stats;
          if (d.history) history = d.history;
          if (d.daily) daily = d.daily;
          cart = []; active = S.categories[0].id;
          rollDay(); doSave(); renderModal(); renderTabs(); renderGrid(); renderTicket();
          toast('Backup ripristinato');
        } catch (err) { toast('File non valido: serve un backup di questa app'); }
      };
      fr.readAsText(f);
      break;
    }
    default: return;
  }
  save();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal) closeModal();
  if (e.key === 'Enter' && e.target.id === 'pin') { e.preventDefault(); $('[data-act="pinok"]').click(); }
  if (e.key === 'Enter' && e.target.id === 'mnote') { e.preventDefault(); $('#maddBtn').click(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'bulk') {
    e.preventDefault();
    document.querySelector(`[data-act="obulk"][data-g="${e.target.dataset.g}"]`).click();
  }
});
window.addEventListener('beforeunload', doSave);

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline non disponibile */ }); });
}

loadStore();
rollDay();
if (!S.categories.some(c => c.id === active)) active = S.categories[0].id;
renderTabs(); renderGrid(); renderTicket();
})();
</script>
</body>
</html>
